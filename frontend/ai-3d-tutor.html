<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gia sư AI 3D - EduAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        #scene-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .chat-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            z-index: 2;
            padding: 1rem;
        }
        .chat-messages {
            height: 200px;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .message {
            margin-bottom: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 1rem;
            max-width: 80%;
        }
        .user-message {
            background-color: #007bff;
            color: white;
            margin-left: auto;
        }
        .ai-message {
            background-color: #f1f1f1;
            margin-right: auto;
        }
        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .voice-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .loading {
            display: none;
        }
        .loading.active {
            display: block;
        }
        .tutor-controls {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 3;
            background: rgba(255, 255, 255, 0.9);
            padding: 1rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body>
    <div id="scene-container"></div>
    
    <div class="tutor-controls">
        <h5>Gia sư AI</h5>
        <div class="mb-3">
            <label class="form-label">Môn học</label>
            <select class="form-select" id="subjectSelect">
                <option value="math">Toán học</option>
                <option value="physics">Vật lý</option>
                <option value="chemistry">Hóa học</option>
                <option value="biology">Sinh học</option>
                <option value="english">Tiếng Anh</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Chủ đề</label>
            <input type="text" class="form-control" id="topicInput" placeholder="Nhập chủ đề...">
        </div>
        <div class="mb-3">
            <label class="form-label">Độ khó</label>
            <select class="form-select" id="difficultySelect">
                <option value="beginner">Cơ bản</option>
                <option value="intermediate">Trung bình</option>
                <option value="advanced">Nâng cao</option>
            </select>
        </div>
        <button class="btn btn-primary" id="startSession">Bắt đầu buổi học</button>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message ai-message">
                Xin chào! Tôi là gia sư AI của EduAI. Tôi có thể giúp gì cho bạn?
            </div>
        </div>
        <div class="controls">
            <div class="voice-control">
                <button class="btn btn-outline-primary" id="startListening">
                    <i class="fas fa-microphone"></i>
                </button>
                <span id="listeningStatus" class="text-muted">Nhấn để nói</span>
            </div>
            <input type="text" class="form-control" id="userInput" placeholder="Nhập câu hỏi của bạn...">
            <button class="btn btn-primary" id="sendButton">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
        <div class="loading mt-2 text-center" id="loadingIndicator">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <script>
        // Three.js Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('scene-container').appendChild(renderer.domElement);

        // Add lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(0, 1, 0);
        scene.add(directionalLight);

        // Load AI character model
        const loader = new THREE.GLTFLoader();
        let aiCharacter;
        loader.load('models/ai-character.glb', function(gltf) {
            aiCharacter = gltf.scene;
            scene.add(aiCharacter);
            aiCharacter.position.set(0, -1, -5);
            aiCharacter.scale.set(0.5, 0.5, 0.5);
        });

        camera.position.z = 5;

        // Animation
        function animate() {
            requestAnimationFrame(animate);
            if (aiCharacter) {
                aiCharacter.rotation.y += 0.01;
            }
            renderer.render(scene, camera);
        }
        animate();

        // Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'vi-VN';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        const startListeningBtn = document.getElementById('startListening');
        const listeningStatus = document.getElementById('listeningStatus');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');
        const loadingIndicator = document.getElementById('loadingIndicator');

        startListeningBtn.addEventListener('click', () => {
            recognition.start();
            listeningStatus.textContent = 'Đang nghe...';
            startListeningBtn.classList.add('active');
        });

        recognition.onresult = (event) => {
            const speechResult = event.results[0][0].transcript;
            userInput.value = speechResult;
            listeningStatus.textContent = 'Nhấn để nói';
            startListeningBtn.classList.remove('active');
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error', event.error);
            listeningStatus.textContent = 'Lỗi nhận dạng giọng nói';
            startListeningBtn.classList.remove('active');
        };

        // Speech Synthesis
        const synth = window.speechSynthesis;
        const voices = synth.getVoices();

        function speak(text) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'vi-VN';
            utterance.rate = 1.0;
            synth.speak(utterance);
        }

        // Chat functionality
        function addMessage(message, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'ai-message'}`;
            messageDiv.textContent = message;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            if (!isUser) {
                speak(message);
            }
        }

        async function sendMessage() {
            const question = userInput.value.trim();
            if (!question) return;

            addMessage(question, true);
            userInput.value = '';
            loadingIndicator.classList.add('active');

            try {
                const response = await fetch('/ai/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({ question }),
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (data.success) {
                    addMessage(data.response);
                } else {
                    addMessage(`Xin lỗi, đã có lỗi xảy ra: ${data.message || 'Không xác định'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage(`Xin lỗi, đã có lỗi xảy ra: ${error.message}`);
            } finally {
                loadingIndicator.classList.remove('active');
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Tutor session management
        const startSessionBtn = document.getElementById('startSession');
        const subjectSelect = document.getElementById('subjectSelect');
        const topicInput = document.getElementById('topicInput');
        const difficultySelect = document.getElementById('difficultySelect');

        startSessionBtn.addEventListener('click', async () => {
            const subject = subjectSelect.value;
            const topic = topicInput.value;
            const difficulty = difficultySelect.value;

            if (!subject || !topic) {
                alert('Vui lòng chọn môn học và chủ đề');
                return;
            }

            try {
                const response = await fetch('/ai/tutor/start', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    body: JSON.stringify({
                        subject,
                        topic,
                        difficulty
                    }),
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                if (data.success) {
                    addMessage(data.response);
                    startSessionBtn.disabled = true;
                    subjectSelect.disabled = true;
                    topicInput.disabled = true;
                    difficultySelect.disabled = true;
                } else {
                    alert(`Không thể bắt đầu buổi học: ${data.message || 'Không xác định'}`);
                }
            } catch (error) {
                console.error('Error:', error);
                alert(`Đã có lỗi xảy ra: ${error.message}`);
            }
        });

        // Load 3D model
        loader.load(
            'assets/models/ai-character.glb',
            (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                model.position.set(0, -1, 0);
                scene.add(model);
                animate();
            },
            undefined,
            (error) => {
                console.error('Error loading 3D model:', error);
                // Fallback to a simple cube if model fails to load
                const geometry = new THREE.BoxGeometry(1, 1, 1);
                const material = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(0, 0, 0);
                scene.add(cube);
                animate();
            }
        );

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
