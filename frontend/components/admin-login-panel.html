<!-- Admin Login Panel Component -->
<div id="admin-login-panel" class="admin-login-container bg-white rounded-lg shadow-md p-8 max-w-md mx-auto">
    <div class="text-center mb-8">
        <img src="/frontend/assets/images/logo.png" alt="EduAI Logo" class="h-16 mx-auto mb-4">
        <h2 class="text-2xl font-bold text-gray-800">Đăng nhập Quản trị</h2>
        <p class="text-gray-600 mt-2">Nhập thông tin đăng nhập để truy cập khu vực quản trị</p>
    </div>

    <form id="admin-login-form" class="space-y-6">
        <!-- Email -->
        <div>
            <label for="admin-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-envelope text-gray-400"></i>
                </div>
                <input type="email" id="admin-email" name="email" required
                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Nhập email của bạn">
            </div>
        </div>

        <!-- Password -->
        <div>
            <label for="admin-password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fas fa-lock text-gray-400"></i>
                </div>
                <input type="password" id="admin-password" name="password" required
                    class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    placeholder="Nhập mật khẩu của bạn">
            </div>
        </div>

        <!-- Remember Me -->
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <input id="admin-remember" name="remember" type="checkbox"
                    class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                <label for="admin-remember" class="ml-2 block text-sm text-gray-700">
                    Ghi nhớ đăng nhập
                </label>
            </div>
            <a href="#" class="text-sm text-blue-600 hover:text-blue-500">
                Quên mật khẩu?
            </a>
        </div>

        <!-- Submit -->
        <button type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            <i class="fas fa-sign-in-alt mr-2"></i> Đăng nhập
        </button>
    </form>

    <div class="mt-6">
        <div class="relative">
            <div class="absolute inset-0 flex items-center">
                <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
                <span class="px-2 bg-white text-gray-500">
                    Thông tin đăng nhập
                </span>
            </div>
        </div>

        <div class="mt-4 text-sm text-center text-gray-600">
            <p>Demo account: <strong>admin@eduai.com</strong> / <strong>admin123</strong></p>
            <p class="mt-1">Hoặc <a href="/index.html" class="text-blue-600 hover:text-blue-500">quay lại trang chủ</a></p>
        </div>
    </div>
</div>

<!-- Admin Dashboard Panel (hiện khi đã đăng nhập) -->
<div id="admin-dashboard-panel" class="hidden">
    <!-- Nội dung dashboard sẽ được hiển thị ở đây -->
</div>
